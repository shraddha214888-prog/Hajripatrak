<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Main School Badge / Register Icon Group -->
  <g filter="url(#shadow)" transform="translate(64, 56)">
    <!-- Clipboard / Register backboard -->
    <rect x="32" y="48" width="320" height="340" rx="32" fill="#ffffff" />
    
    <!-- Top Clip -->
    <rect x="128" y="24" width="128" height="44" rx="14" fill="#0284c7" />
    <circle cx="192" cy="46" r="10" fill="#ffffff" />

    <!-- Register Header line -->
    <rect x="68" y="96" width="160" height="18" rx="9" fill="#0369a1" />
    <rect x="68" y="124" width="248" height="8" rx="4" fill="#cbd5e1" />
    
    <!-- Student Row 1 -->
    <circle cx="92" cy="164" r="16" fill="#38bdf8" />
    <rect x="120" y="156" width="140" height="12" rx="6" fill="#64748b" />
    <!-- Checkmark Green Badge -->
    <circle cx="310" cy="164" r="16" fill="#10b981" />
    <path d="M303 164l5 5 10-10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Student Row 2 -->
    <circle cx="92" cy="216" r="16" fill="#f43f5e" />
    <rect x="120" y="208" width="120" height="12" rx="6" fill="#64748b" />
    <!-- Checkmark Green Badge -->
    <circle cx="310" cy="216" r="16" fill="#10b981" />
    <path d="M303 216l5 5 10-10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Student Row 3 -->
    <circle cx="92" cy="268" r="16" fill="#0284c7" />
    <rect x="120" y="260" width="150" height="12" rx="6" fill="#64748b" />
    <!-- Checkmark Green Badge -->
    <circle cx="310" cy="268" r="16" fill="#10b981" />
    <path d="M303 268l5 5 10-10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Std 7 Badge on bottom right -->
    <g transform="translate(220, 270)">
      <circle cx="70" cy="70" r="54" fill="#f59e0b" stroke="#ffffff" stroke-width="6" />
      <text x="70" y="66" font-family="'Noto Sans Gujarati', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">ધો-૭</text>
      <text x="70" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">STD 7</text>
    </g>
  </g>
</svg>
